name: Build and Release Single-File Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run unit tests
        run: go test -v ./...

      - name: Cross-compile static single-file binaries
        run: |
          mkdir -p dist
          export CGO_ENABLED=0
          LDFLAGS="-s -w"

          echo "Building Windows amd64..."
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/duomi-image-gen-windows-amd64.exe .

          echo "Building Windows arm64..."
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/duomi-image-gen-windows-arm64.exe .

          echo "Building Linux amd64..."
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/duomi-image-gen-linux-amd64 .

          echo "Building Linux arm64..."
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/duomi-image-gen-linux-arm64 .

          echo "Building macOS amd64 (Intel)..."
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/duomi-image-gen-darwin-amd64 .

          echo "Building macOS arm64 (Apple Silicon)..."
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/duomi-image-gen-darwin-arm64 .

          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Create or Update GitHub Release with Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG:-v1.0.2}"
          else
            TAG="${REF_NAME}"
          fi

          echo "Generating changelog for tag: ${TAG}"

          python3 - "${TAG}" << 'PYEOF' > release_notes.md
          import re, subprocess, sys

          tag = sys.argv[1]
          notes = ""
          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = rf"(## \[{re.escape(tag)}\].*?)(?=\n---\n|\n## \[|\Z)"
              m = re.search(pattern, content, flags=re.S)
              if m:
                  notes = m.group(1).strip()
          except Exception:
              pass

          prev_tag = ""
          try:
              tags = subprocess.check_output(
                  ["git", "tag", "--sort=-creatordate"], text=True
              ).splitlines()
              tags = [t.strip() for t in tags if t.strip()]
              if tag in tags:
                  idx = tags.index(tag)
                  if idx + 1 < len(tags):
                      prev_tag = tags[idx + 1]
              elif tags:
                  prev_tag = tags[0]
          except Exception:
              pass

          log_range = f"{prev_tag}..{tag}" if prev_tag else tag
          try:
              commits = subprocess.check_output(
                  ["git", "log", log_range, "--pretty=format:- %h %s"], text=True
              ).strip()
          except Exception:
              commits = ""

          print(f"# 📋 {tag} 更新日志 (Changelog)\n")
          if notes:
              print(notes)
              print("")
          if commits:
              print("### 📝 提交记录 (Commits)")
              print(commits)
          PYEOF

          cat release_notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --title "DuomiAPI Image Studio ${TAG}" --notes-file release_notes.md
          else
            gh release create "${TAG}" dist/* \
              --title "DuomiAPI Image Studio ${TAG}" \
              --notes-file release_notes.md
          fi

